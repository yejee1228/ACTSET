name: CI

# P-1: 빌드·테스트·마이그레이션 검증을 PR마다 자동 실행한다(docs/13).
# 이 저장소는 아직 원격이 없어(오버나이트 진행 중) 실제로 트리거된 적은 없지만,
# 원격을 붙이는 순간 그대로 동작하도록 구성해 둔다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: actset
          POSTGRES_PASSWORD: actset_dev_local
          POSTGRES_DB: actset
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build + unit test
        working-directory: backend
        run: mvn -B -q package

      - name: Verify Flyway migrations apply cleanly
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 55432
          DB_NAME: actset
          DB_USER: actset
          DB_PASSWORD: actset_dev_local
        run: |
          timeout 30 java -jar target/actset.jar --spring.profiles.active=web \
            --server.port=18080 --logging.level.org.flywaydb=INFO &
          APP_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://localhost:18080/actuator/health && break
            sleep 2
          done
          curl -sf http://localhost:18080/actuator/health
          kill $APP_PID

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
