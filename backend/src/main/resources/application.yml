spring:
  application:
    name: actset
  profiles:
    active: web
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:55432}/${DB_NAME:actset}
    username: ${DB_USER:actset}
    password: ${DB_PASSWORD:actset_dev_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

actset:
  storage:
    root: ${STORAGE_ROOT:../storage}
  credit:
    signup-grant: 500
  external:
    mock-mode: true
