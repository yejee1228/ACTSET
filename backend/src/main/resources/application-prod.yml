# P-2 환경 분리 — 운영. 모든 시크릿(DB 비밀번호·향후 Ideogram/Qwen/SES 키)은
# 환경변수로만 주입한다 — 이 파일에도, 다른 어떤 파일에도 실제 값을 넣지 않는다(P-2 완료기준).
logging:
  level:
    com.actset: INFO
    org.hibernate.SQL: WARN

management:
  endpoint:
    health:
      show-details: never

# 벤더 키(IDEOGRAM_API_KEY·OPENAI_API_KEY·KOPIS_SERVICE_KEY)는 application.yml의
# 기본값을 통해 환경변수로만 주입된다 — 여기서 중복 선언하지 않는다. 비워두면
# 해당 벤더만 자동으로 목업으로 동작한다(벤더별 독립, docs/14).
